<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Appel de présence</title>
<style>
  :root{
    --bg:#0b1220; --bg-soft:#121b2e; --line:#22304a;
    --text:#e8edf7; --muted:#8b9bb8;
    --accent:#3fd0c9; --accent-dim:#1f7a75;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh;
    background: radial-gradient(circle at 50% -10%, #16233d 0%, var(--bg) 55%);
    color:var(--text); font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    padding:32px 20px;
  }
  .wrap{ max-width:960px; margin:0 auto; }
  h1{ font-size:24px; margin:0 0 4px; }
  p.sub{ color:var(--muted); font-size:14px; margin:0 0 28px; }

  .login{ max-width:360px; margin:80px auto; background:var(--bg-soft); border:1px solid var(--line);
    border-radius:14px; padding:28px; }
  .login label{ font-size:13px; color:var(--muted); display:block; margin-bottom:6px; }
  .login input{ width:100%; padding:11px 13px; border-radius:9px; border:1px solid var(--line);
    background:#0e1626; color:var(--text); font-size:14px; }
  .login button{ width:100%; margin-top:14px; padding:11px; border:none; border-radius:9px;
    background:var(--accent); color:#06231f; font-weight:600; cursor:pointer; }
  .login .err{ color:#ff8a94; font-size:13px; margin-top:10px; display:none; }

  #dashboard{ display:none; }

  .grid{ display:grid; grid-template-columns: 340px 1fr; gap:20px; }
  @media (max-width:760px){ .grid{ grid-template-columns:1fr; } }

  .panel{ background:var(--bg-soft); border:1px solid var(--line); border-radius:14px; padding:22px; }
  .panel h2{ font-size:14px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:0 0 14px; }

  #qr-panel{ text-align:center; }
  #qr-panel img{ width:100%; max-width:300px; border-radius:10px; background:#fff; padding:14px; }
  .qr-status{ margin-top:12px; font-size:13px; color:var(--muted); }
  .qr-status.ready{ color:var(--accent); }

  .count{ font-size:42px; font-weight:700; color:var(--accent); line-height:1; }
  .count-label{ color:var(--muted); font-size:13px; margin-top:4px; }

  ul#participants{ list-style:none; margin:16px 0 0; padding:0; max-height:280px; overflow-y:auto; }
  ul#participants li{ padding:9px 0; border-bottom:1px solid var(--line); font-size:14px;
    display:flex; justify-content:space-between; color:var(--text); }
  ul#participants li span.time{ color:var(--muted); font-size:12px; }
  ul#participants:empty::after{ content:"En attente des premières validations…"; color:var(--muted); font-size:13px; }

  .action-btn{
    width:100%; margin-top:20px; padding:15px; border:none; border-radius:12px;
    background: var(--accent); color:#06231f; font-weight:700; font-size:15px;
    cursor:pointer; letter-spacing:.01em;
  }
  .action-btn:hover{ background:#57d9d3; }
  .action-btn:active{ transform: scale(0.99); }
  .action-btn:disabled{ opacity:.5; cursor:not-allowed; }

  .reset-btn{
    width:100%; margin-top:10px; padding:10px; border-radius:10px;
    border:1px solid var(--line); background:transparent; color:var(--muted);
    cursor:pointer; font-size:13px;
  }
  .reset-btn:hover{ border-color:#5a6f95; color:var(--text); }

  .status-msg{ margin-top:12px; font-size:13px; text-align:center; min-height:18px; color:var(--muted); }
  .status-msg.ok{ color:var(--accent); }

  .formateur-note{
    margin-top:10px; font-size:11px; color:#5a6f95; text-align:center;
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="login" id="login-box">
    <h1>Appel de présence</h1>
    <p class="sub">Espace formateur</p>
    <label for="pwd">Mot de passe</label>
    <input type="password" id="pwd" placeholder="••••••••">
    <button id="login-btn">Se connecter</button>
    <div class="err" id="login-err">Mot de passe incorrect.</div>
  </div>

  <div id="dashboard">
    <h1>Appel de présence</h1>
    <p class="sub">Scannez le QR code ci-dessous pour valider votre présence</p>

    <div class="grid">
      <div class="panel" id="qr-panel">
        <h2>QR code</h2>
        <img id="qr-img" src="" alt="QR code">
        <div class="qr-status" id="qr-status">En attente de l'URL publique…</div>
      </div>

      <div class="panel">
        <h2>Présences validées</h2>
        <div class="count" id="count">0</div>
        <div class="count-label">participant(s)</div>
        <ul id="participants"></ul>

        <button class="action-btn" id="trigger-btn">Finalisation saisie présence</button>
        <div class="status-msg" id="trigger-status"></div>
        <button class="reset-btn" id="reset-btn">Réinitialiser la session</button>
        <div class="formateur-note">Visible formateur uniquement — action réservée</div>
      </div>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
  const socket = io();
  let ADMIN_PWD = '';

  const loginBox = document.getElementById('login-box');
  const dashboard = document.getElementById('dashboard');
  const loginErr = document.getElementById('login-err');

  function authHeaders(){
    return { 'Content-Type': 'application/json', 'x-admin-password': ADMIN_PWD };
  }

  async function login(pwd){
    const res = await fetch('/api/participants', { headers: { 'x-admin-password': pwd } });
    if (res.ok) {
      ADMIN_PWD = pwd;
      loginBox.style.display = 'none';
      dashboard.style.display = 'block';
      socket.emit('join-admin', pwd);
      refreshParticipants();
      loadQr();
      loadCurrentUrl();
    } else {
      loginErr.style.display = 'block';
    }
  }

  document.getElementById('login-btn').addEventListener('click', () => {
    login(document.getElementById('pwd').value);
  });
  document.getElementById('pwd').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') login(document.getElementById('pwd').value);
  });

  function renderParticipants(list){
    document.getElementById('count').textContent = list.length;
    const ul = document.getElementById('participants');
    ul.innerHTML = '';
    list.slice().reverse().forEach(p => {
      const li = document.createElement('li');
      const t = new Date(p.time).toLocaleTimeString('fr-FR');
      li.innerHTML = `<span>${p.name}</span><span class="time">${t}</span>`;
      ul.appendChild(li);
    });
  }

  async function refreshParticipants(){
    const res = await fetch('/api/participants', { headers: { 'x-admin-password': ADMIN_PWD } });
    if (res.ok) {
      const data = await res.json();
      renderParticipants(data.participants);
    }
  }

  socket.on('participant-joined', () => refreshParticipants());

  function loadQr(){
    document.getElementById('qr-img').src = '/api/qrcode.png?t=' + Date.now();
  }

  function setQrStatus(url){
    const el = document.getElementById('qr-status');
    if (url && !url.includes('localhost')) {
      el.textContent = 'QR code actif — prêt à être projeté';
      el.classList.add('ready');
    } else {
      el.textContent = "En attente de l'URL publique du tunnel…";
      el.classList.remove('ready');
    }
  }

  async function loadCurrentUrl(){
    const res = await fetch('/api/current-url');
    const data = await res.json();
    setQrStatus(data.PUBLIC_URL);
  }

  // Mise à jour automatique dès que le tunnel Cloudflare (ou un appel manuel
  // à /api/set-url) publie une nouvelle URL — aucune action requise ici.
  socket.on('url-updated', (data) => {
    loadQr();
    setQrStatus(data.PUBLIC_URL);
  });

  document.getElementById('trigger-btn').addEventListener('click', async () => {
    const btn = document.getElementById('trigger-btn');
    btn.disabled = true;
    const res = await fetch('/api/trigger-trap', { method:'POST', headers: authHeaders() });
    const data = await res.json();
    const status = document.getElementById('trigger-status');
    status.textContent = `Saisie finalisée — ${data.notified} participant(s).`;
    status.classList.add('ok');
    setTimeout(() => { btn.disabled = false; }, 2000);
  });

  document.getElementById('reset-btn').addEventListener('click', async () => {
    if (!confirm('Réinitialiser la liste des participants ?')) return;
    await fetch('/api/reset', { method:'POST', headers: authHeaders() });
    refreshParticipants();
  });
</script>
</body>
</html>
